name: Enable PR auto-merge on label

on:
  pull_request:
    types: [labeled, opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    # Only for PRs into main AND when the 'automerge' label is present
    if: >
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const pr = await github.rest.pulls.get({ owner, repo, pull_number: number });

            // Enable auto-merge using GraphQL (requires repo setting "Allow auto-merge")
            const mutation = `
              mutation($id: ID!) {
                enablePullRequestAutoMerge(
                  input: { pullRequestId: $id, mergeMethod: SQUASH }
                ) { clientMutationId }
              }
            `;
            await github.graphql(mutation, { id: pr.data.node_id });