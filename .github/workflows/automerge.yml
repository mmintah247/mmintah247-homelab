name: Enable PR auto-merge on label (after approval)

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  pull_request_review:
    types: [submitted]   # re-run when reviews are submitted

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // 'github', 'context', and 'core' are provided by github-script.
            const { owner, repo } = context.repo;
            const prNumber =
              (context.payload.pull_request && context.payload.pull_request.number) ||
              context.issue.number;

            if (!prNumber) {
              core.info('No pull request number found in context; exiting.');
              return;
            }

            // Load fresh PR (labels, draft, base)
            const prResp = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const pr = prResp.data;
            const labels = (pr.labels || []).map(l => l.name);

            if (!labels.includes('automerge')) {
              core.info('Label `automerge` not present; skipping.');
              return;
            }
            if (pr.base.ref !== 'main') {
              core.info(`Base branch is ${pr.base.ref}, not main; skipping.`);
              return;
            }
            if (pr.draft) {
              core.info('PR is draft; skipping.');
              return;
            }

            // Check overall review decision via GraphQL
            const query = `
              query($owner:String!, $name:String!, $number:Int!) {
                repository(owner:$owner, name:$name) {
                  pullRequest(number:$number) {
                    id
                    reviewDecision        # APPROVED | CHANGES_REQUESTED | REVIEW_REQUIRED
                    isDraft
                    baseRefName
                  }
                }
              }`;
            const data = await github.graphql(query, { owner, name: repo, number: prNumber });
            const prx = data.repository.pullRequest;

            if (prx.reviewDecision !== 'APPROVED') {
              core.info(`PR not approved yet (reviewDecision=${prx.reviewDecision}); skipping.`);
              return;
            }

            // Enable auto-merge (repo setting "Allow auto-merge" must be ON)
            const mutation = `
              mutation($id: ID!) {
                enablePullRequestAutoMerge(
                  input: { pullRequestId: $id, mergeMethod: SQUASH }
                ) { clientMutationId }
              }`;
            await github.graphql(mutation, { id: prx.id });
            core.info('Auto-merge enabled; GitHub will merge after required checks pass.');