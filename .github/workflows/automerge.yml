name: Enable PR auto-merge on label (after approval)

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  pull_request_review:
    types: [submitted]   # re-check when reviews arrive

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const { owner, repo, number } = context.issue;

            // Fetch PR (labels + node_id)
            const pr = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const labels = (pr.data.labels || []).map(l => l.name);
            const hasLabel = labels.includes('automerge');

            if (!hasLabel) {
              core.info('No `automerge` label; skipping.');
              return;
            }

            // GraphQL: check reviewDecision, draft, base branch
            const q = `
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    id
                    isDraft
                    baseRefName
                    reviewDecision     # APPROVED | CHANGES_REQUESTED | REVIEW_REQUIRED
                  }
                }
              }`;
            const data = await github.graphql(q, { owner, repo, number });
            const prx = data.repository.pullRequest;

            if (prx.baseRefName !== 'main') {
              core.info('Base is not main; skipping.');
              return;
            }
            if (prx.isDraft) {
              core.info('PR is draft; skipping.');
              return;
            }
            if (prx.reviewDecision !== 'APPROVED') {
              core.info(`PR not approved yet (reviewDecision=${prx.reviewDecision}); skipping.`);
              return;
            }

            // Enable auto-merge (repo must have "Allow auto-merge" enabled)
            const mutation = `
              mutation($id: ID!) {
                enablePullRequestAutoMerge(
                  input: { pullRequestId: $id, mergeMethod: SQUASH }
                ) { clientMutationId }
              }`;
            await github.graphql(mutation, { id: prx.id });
            core.info('Auto-merge enabled. GitHub will merge after required checks pass.');