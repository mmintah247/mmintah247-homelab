name: Enable PR auto-merge on label (after approval)

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: enable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // github, context, core are provided by github-script
            const { owner, repo } = context.repo;
            const prNumber =
              context.payload.pull_request?.number ??
              context.issue?.number;

            if (!prNumber) {
              core.info('No pull request number in context; exiting.');
              return;
            }

            // Load fresh PR details
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;

            // --- Basic guards ---
            const labelNames = (pr.labels || []).map(l => String(l.name).toLowerCase());
            const hasAutoMergeLabel =
              labelNames.includes('automerge') ||
              labelNames.includes('auto-merge') ||
              labelNames.includes('merge-when-green');

            if (!hasAutoMergeLabel) {
              core.info('Automerge label not present; skipping.');
              return;
            }
            if (pr.base.ref !== 'main') {
              core.info(`Base branch is '${pr.base.ref}', not 'main'; skipping.`);
              return;
            }
            if (pr.draft) {
              core.info('PR is draft; skipping.');
              return;
            }

            // --- Review decision check via GraphQL ---
            const query = `
              query($owner:String!, $name:String!, $number:Int!) {
                repository(owner:$owner, name:$name) {
                  pullRequest(number:$number) {
                    id
                    reviewDecision        # APPROVED | CHANGES_REQUESTED | REVIEW_REQUIRED
                    isDraft
                    baseRefName
                    autoMergeRequest { enabledAt }
                  }
                }
              }`;
            const data = await github.graphql(query, { owner, name: repo, number: prNumber });
            const prx = data.repository.pullRequest;
            const decision = prx.reviewDecision || 'REVIEW_REQUIRED';

            if (decision === 'CHANGES_REQUESTED') {
              // If someone requested changes, make sure auto-merge is OFF
              if (prx.autoMergeRequest) {
                const disable = `
                  mutation($id: ID!) {
                    disablePullRequestAutoMerge(input: { pullRequestId: $id }) { clientMutationId }
                  }`;
                await github.graphql(disable, { id: prx.id });
                core.info('Changes requested; disabled auto-merge.');
              } else {
                core.info('Changes requested; auto-merge not enabled. Skipping.');
              }
              return;
            }

            if (decision !== 'APPROVED') {
              core.info(`PR not approved yet (reviewDecision=${decision}); skipping.`);
              return;
            }

            // --- Enable auto-merge (requires repo setting "Allow auto-merge") ---
            const mutation = `
              mutation($id: ID!) {
                enablePullRequestAutoMerge(
                  input: {
                    pullRequestId: $id,
                    mergeMethod: SQUASH
                  }
                ) {
                  clientMutationId
                }
              }`;
            await github.graphql(mutation, { id: prx.id });
            core.info('Auto-merge enabled. GitHub will merge once required checks pass.');