name: Deploy MkDocs site

on:
  pull_request:
    branches: [ main ]          # run build on PRs to main
  push:
    branches: [ main ]          # build + deploy on main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # <-- no caching

      - run: python -m pip install --upgrade pip
      - run: pip install mkdocs-material
      - run: pip install "mkdocs-material[imaging]"
      - run: pip install mkdocs-minify-plugin mkdocs-git-revision-date-localized-plugin mkdocs-git-committers-plugin-2
      - run: pip install mkdocs-git-authors-plugin

      - name: Set git committers token (fallback to GITHUB_TOKEN)
        run: |
          if [ -n "${{ secrets.homelab-uat }}" ]; then
            echo "MKDOCS_GIT_COMMITTERS_APIKEY=${{ secrets.homelab-uat }}" >> $GITHUB_ENV
          else
            echo "MKDOCS_GIT_COMMITTERS_APIKEY=${{ github.token }}" >> $GITHUB_ENV
          fi

      - name: Build site
        run: mkdocs build --strict

      - name: Upload artifact for Pages
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4