name: Deploy MkDocs site

on:
  pull_request:
    branches: [ main ] 
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
  
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git-based plugins
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install mkdocs-material
      - run: pip install "mkdocs-material[imaging]"
      - run: pip install mkdocs-minify-plugin mkdocs-git-revision-date-localized-plugin mkdocs-git-committers-plugin-2

      - run: pip install mkdocs-git-authors-plugin
      - name: Set git committers token (fallback to GITHUB_TOKEN)
        run: |
          if [ -n "${{ secrets['homelab-uat'] }}" ]; then
            echo "MKDOCS_GIT_COMMITTERS_APIKEY=${{ secrets['homelab-uat'] }}" >> $GITHUB_ENV
          else
            echo "MKDOCS_GIT_COMMITTERS_APIKEY=${{ github.token }}" >> $GITHUB_ENV
          fi
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write        # to deploy to Pages
      id-token: write 
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
