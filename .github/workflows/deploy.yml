name: Deploy MkDocs site

on:
  pull_request:
    branches: [ main ]       # run checks on PRs
  push:
    branches: [ main ]       # build + deploy on main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git-based plugins

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install MkDocs + plugins
        run: |
          python -m pip install --upgrade pip
          pip install \
            mkdocs-material \
            "mkdocs-material[imaging]" \
            mkdocs-minify-plugin \
            mkdocs-git-revision-date-localized-plugin \
            mkdocs-git-committers-plugin-2 \
            mkdocs-git-authors-plugin

      - name: Set git committers token (fallback to GITHUB_TOKEN)
        run: |
          if [ -n "${{ secrets.homelab-uat }}" ]; then
            echo "MKDOCS_GIT_COMMITTERS_APIKEY=${{ secrets.homelab-uat }}" >> $GITHUB_ENV
          else
            echo "MKDOCS_GIT_COMMITTERS_APIKEY=${{ github.token }}" >> $GITHUB_ENV
          fi

      - name: Build site
        run: mkdocs build --strict

      - name: Upload artifact (for Pages)
        if: ${{ github.event_name == 'push' }}   # only needed for deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy
    if: ${{ github.event_name == 'push' }}       # deploy only on push to main
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write        # to deploy to Pages
      id-token: write     # to authenticate to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4